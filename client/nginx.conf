server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA under /dashboard-local
    location /dashboard-local {
        try_files $uri $uri/ /dashboard-local/index.html;
    }

    # Redirect root to the app
    location = / {
        return 301 /dashboard-local/;
    }
}
